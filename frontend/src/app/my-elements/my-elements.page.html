<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>my-elements</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let b of elements">
      <ion-avatar slot="start">
        <img *ngIf="b.filename" src="http://localhost:8080/images/{{b.filename}}" alt="image" />
      </ion-avatar>
      <ion-label>
        <h1>{{b.name}}</h1>
        <p>{{b.treatment}}</p>
        <p>{{b.description}}</p>
        <ion-button (click)="deleteElement(b.id)">Borrar
          <ion-icon name="close-circle"></ion-icon>
        </ion-button>
        <ion-button (click)="updateElement(b.id)">Modificar
          <ion-icon name="pencil"></ion-icon>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="addElements()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  
  <ion-fab vertical="bottom" horizontal="start" slot="fixed">
    <ion-fab-button (click)="goHome()">
      <ion-icon name="home"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
